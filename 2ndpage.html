  <script>

    var sidenav = document.querySelector(".side");

    function showNavbar()
    {
      sidenav.style.left = "0";
    }

    function closeNavbar()
    {
      sidenav.style.left = "-60%";
    }

    var search = document.getElementById("search");

    var productContainer = document.getElementById("products");

    var productlist = productContainer.querySelectorAll(".products-box");

    search.addEventListener("keyup", function(event)
    {

      var enteredValue = event.target.value.toUpperCase();

      for (var count = 0; count < productlist.length; count = count + 1)
      {

        var productname =
          productlist[count].querySelector("p").textContent;

        if (productname.toUpperCase().indexOf(enteredValue) < 0)
        {

          productlist[count].style.display = "none";

        }
        else
        {

          productlist[count].style.display = "block";

        }

      }

    });

  </script>
